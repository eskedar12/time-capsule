<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f1ea;font-family:Georgia,'Times New Roman',serif;color:#2b2a27;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8473;">Time Capsule</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Your time capsule is ready</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">
                  &ldquo;{{title}}&rdquo; from {{fromLine}} is unlocked. It&rsquo;s been waiting for you.
                </p>
                <a href="{{link}}" style="display:inline-block;background:#2b2a27;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-family:Arial,sans-serif;font-size:15px;">Open your capsule</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8a8473;">Button not working? Paste this link into your browser:<br />{{link}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
